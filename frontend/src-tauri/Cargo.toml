[package]
name = "p2p-ledger"
version = "0.3.9"
description = "P2P Ledger — Terminal de Conciliación P2P"
authors = ["marcossglr"]
license = "GPL-3.0-only"
repository = "https://github.com/marcossglr/P2P-ledger"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
