<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <clipPath id="clipA">
      <rect x="96" y="96" width="224" height="224" rx="48"/>
    </clipPath>
  </defs>

  <!-- Fondo del icono -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="110.5" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="3"/>

  <!-- Cuenta A -->
  <rect x="96" y="96" width="224" height="224" rx="48" fill="url(#a)"/>
  <!-- Cuenta B -->
  <rect x="192" y="192" width="224" height="224" rx="48" fill="url(#b)"/>
  <!-- Intersección: punto de conciliación -->
  <rect x="192" y="192" width="224" height="224" rx="48" fill="#fef3c7" clip-path="url(#clipA)"/>
</svg>
