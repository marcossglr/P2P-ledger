name: Multiplatform Release (.rpm, .deb, .exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versión a publicar (ej: v0.3.9). Déjalo vacío para usar la versión de tauri.conf.json'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Determinar versión del release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Extraer versión
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v${APP_VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag resuelto: ${TAG}"

  build-linux:
    name: Compilar para Linux (.rpm / .AppImage / .deb)
    needs: resolve-tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Instalar dependencias del sistema (WebKitGTK, RPM tools, GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm build-essential

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Instalar dependencias del Frontend
        run: npm install

      - name: Compilar paquete nativo Linux con Tauri (.rpm / .deb / .AppImage)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve-tag.outputs.tag }}
          releaseName: 'P2P Ledger ${{ needs.resolve-tag.outputs.tag }}'
          releaseBody: 'Release nativo multiplataforma en Rust para P2P Ledger con soporte de auto-actualizaciones.'
          releaseDraft: false
          prerelease: false

  build-windows:
    name: Compilar para Windows (.exe / .msi)
    needs: resolve-tag
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependencias del Frontend
        run: npm install

      - name: Compilar instalador nativo Windows con Tauri (.exe / .msi)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve-tag.outputs.tag }}
          releaseName: 'P2P Ledger ${{ needs.resolve-tag.outputs.tag }}'
          releaseBody: 'Release nativo multiplataforma en Rust para P2P Ledger con soporte de auto-actualizaciones.'
          releaseDraft: false
          prerelease: false
