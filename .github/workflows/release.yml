name: Multiplatform Release (.rpm, .deb, .exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Compilar para Linux (.rpm / .AppImage / .deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (WebKitGTK, RPM tools, GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm build-essential

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Empaquetar Backend Sidecar con PyInstaller (Baseline x86-64 Universal)
        run: |
          python -m pip install --upgrade pip wheel
          pip install --no-binary=:all: pyinstaller
          pip install -r backend/requirements.txt
          mkdir -p frontend/src-tauri/binaries
          pyinstaller --onefile \
            --name p2p-ledger-backend-x86_64-unknown-linux-gnu \
            --collect-data certifi \
            --clean \
            backend/desktop_entry.py
          mv dist/p2p-ledger-backend-x86_64-unknown-linux-gnu frontend/src-tauri/binaries/

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm install

      - name: Compilar paquete nativo Linux con Tauri (.rpm / .deb / .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'P2P Ledger ${{ github.ref_name }}'
          releaseBody: 'Release multiplataforma para P2P Ledger con soporte de auto-actualizaciones.'
          releaseDraft: false
          prerelease: false

  build-windows:
    name: Compilar para Windows (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Empaquetar Backend Sidecar con PyInstaller en Windows
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries
          pyinstaller --onefile --name p2p-ledger-backend-x86_64-pc-windows-msvc --collect-data certifi --clean backend/desktop_entry.py
          Copy-Item -Path dist/p2p-ledger-backend-x86_64-pc-windows-msvc.exe -Destination frontend/src-tauri/binaries/p2p-ledger-backend-x86_64-pc-windows-msvc.exe

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm install

      - name: Compilar instalador nativo Windows con Tauri (.exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'P2P Ledger ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
