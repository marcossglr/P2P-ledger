name: Generate Tauri Signing Keys

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Keys
        run: |
          mkdir -p keys
          npx -y @tauri-apps/cli signer generate -w keys/tauri.key -p ""
          echo "=== PUBLIC KEY ==="
          cat keys/tauri.key.pub
          echo ""
          echo "=== SECRET KEY ==="
          cat keys/tauri.key
